name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Test and build
        run: ./gradlew :core:test :mod:build --no-daemon --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: mod/build/libs/randar-189-*.jar
          generate_release_notes: true
