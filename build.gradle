buildscript {
    repositories {
        mavenCentral()
        maven { name = 'forge'; url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/maven' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

allprojects {
    group = 'io.github.sirhumza'
    version = '1.0.0'

    repositories {
        mavenCentral()
        maven { name = 'latticg'; url = 'https://maven.latticg.com/' }
    }
}
